
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>WhatIsTime</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #080808;
}

body {
  min-height: 100svh;
  display: grid;
  place-items: center;
  overflow: hidden;
}

/* DESKTOP – bisherige Darstellung bleibt erhalten */

.scene {
  position: relative;
  width: min(100vw, calc(100svh * 1672 / 941));
  height: min(100svh, calc(100vw * 941 / 1672));
  overflow: hidden;
  background: #080808;
}

.scene > img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

.pillar {
  position: absolute;
  display: grid;
  place-items: center;
  color: #fff;
  text-decoration: none;
  font: 500 clamp(10px, 1.35vw, 21px)/1 Arial, Helvetica, sans-serif;
  letter-spacing: .22em;
  text-shadow: 0 2px 12px #000, 0 1px 3px #000;
  opacity: 0;
  transition: opacity .25s ease;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.pillar::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,.14);
  opacity: 0;
  transition: opacity .25s ease;
  pointer-events: none;
}

.pillar span {
  position: relative;
  z-index: 1;
}

.pillar:hover,
.pillar:focus-visible {
  opacity: 1;
}

.pillar:hover::before,
.pillar:focus-visible::before {
  opacity: 1;
}

.gastro {
  left: 7.45%;
  top: 0;
  width: 17.25%;
  height: 84%;
}

.immo {
  left: 38.1%;
  top: 28.6%;
  width: 10.35%;
  height: 46%;
}

.insta {
  left: 52.7%;
  top: 39.5%;
  width: 8.5%;
  height: 31%;
}

.contact {
  left: 60.8%;
  top: 43%;
  width: 7.8%;
  height: 27%;
  font-size: clamp(8px, .8vw, 13px);
  letter-spacing: .12em;
}

.clock {
  position: absolute;
  left: 81.7%;
  top: 51.5%;
  width: 3.7%;
  aspect-ratio: 1;
  border-radius: 50%;
  opacity: 0;
  transition: opacity .25s ease, box-shadow .25s ease;
  background: rgba(255,255,255,.12);
}

.clock:hover,
.clock:focus-visible {
  opacity: 1;
  box-shadow: 0 0 0 9px rgba(255,255,255,.13),
              0 0 24px rgba(255,255,255,.35);
  outline: none;
}

/* MOBILE – separate portrait composition */

.mobile-scene {
  display: none;
  position: relative;
  width: min(100vw, calc(100svh * 680 / 989));
  aspect-ratio: 680 / 989;
  overflow: hidden;
  background: #080808;
}

.mobile-background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
  pointer-events: none;
  user-select: none;
}

/* Each overlay is a full-size transparent PNG.
   The link is clipped to the corresponding navigation area. */

.mobile-nav {
  position: absolute;
  inset: 0;
  display: block;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

.mobile-nav img {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
  opacity: 0;
  transition: opacity .18s ease;
  pointer-events: none;
  user-select: none;
}

.mobile-nav:hover img,
.mobile-nav:focus-visible img,
.mobile-nav:active img {
  opacity: 1;
}

/* Clickable areas – percentages refer to the complete 680 × 989 image */

.mobile-gastro {
  clip-path: inset(47% 72% 43% 9%);
}

.mobile-immo {
  clip-path: inset(50% 41% 42% 40%);
}

.mobile-insta {
  clip-path: inset(52% 29% 41% 58%);
}

.mobile-contact {
  clip-path: inset(54% 19% 39% 71%);
}

/* Switch between desktop and mobile */

@media (max-width: 700px) and (orientation: portrait) {
  body {
    min-height: 100svh;
    height: 100svh;
    display: grid;
    place-items: center;
  }

  .scene {
    display: none;
  }

  .mobile-scene {
    display: block;
  }
}

@media (prefers-reduced-motion: reduce) {
  .pillar,
  .pillar::before,
  .clock,
  .mobile-nav img {
    transition: none;
  }
}
</style>
</head>

<body>

<!-- DESKTOP -->
<main class="scene" aria-label="WhatIsTime Desktop">
  <img src="assets/garage.png" alt="">

  <a class="pillar gastro"
     href="https://whatistime.space/gastro"
     aria-label="Gastro">
    <span>GASTRO</span>
  </a>

  <a class="pillar immo"
     href="https://whatistime.space/immo"
     aria-label="Immo">
    <span>IMMO</span>
  </a>

  <a class="pillar insta"
     href="https://whatistime.space/insta"
     aria-label="Insta">
    <span>INSTA</span>
  </a>

  <a class="pillar contact"
     href="/contact/"
     aria-label="Contact">
    <span>CONTACT</span>
  </a>

  <a class="clock"
     href="/space/"
     aria-label="Space"></a>
</main>

<!-- MOBILE -->
<main class="mobile-scene" aria-label="WhatIsTime Mobile">

  <img
    class="mobile-background"
    src="assets/mobile/garage-mobile-background.png"
    alt="Architektonische Schwarzweißaufnahme einer Tiefgarage">

  <a class="mobile-nav mobile-gastro"
     href="https://whatistime.space/gastro"
     aria-label="Gastro">
    <img src="assets/mobile/nav-gastro.png" alt="">
  </a>

  <a class="mobile-nav mobile-immo"
     href="https://whatistime.space/immo"
     aria-label="Immo">
    <img src="assets/mobile/nav-immo.png" alt="">
  </a>

  <a class="mobile-nav mobile-insta"
     href="https://whatistime.space/insta"
     aria-label="Insta">
    <img src="assets/mobile/nav-insta.png" alt="">
  </a>

  <a class="mobile-nav mobile-contact"
     href="/contact/"
     aria-label="Contact">
    <img src="assets/mobile/nav-contact.png" alt="">
  </a>

</main>

</body>
</html>
